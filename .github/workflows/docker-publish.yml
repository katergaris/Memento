name: Pubblica immagine Docker

# Build automatica dell'immagine ad ogni push su main, pubblicata su GitHub
# Container Registry: e' l'immagine che CasaOS (e chiunque altro) scarica
# gia' pronta, senza dover clonare o compilare nulla sul proprio NAS.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome immagine (minuscolo, richiesto da Docker)
        id: image
        # Fisso a "memento" (non deriva dal nome del repository GitHub, che
        # puo' restare "MindKeep" anche dopo il rebranding): l'owner invece
        # resta dinamico, cosi' funziona anche se il repo cambia organizzazione.
        # "legacy" = vecchio nome "mindkeep", pubblicato in parallelo finche'
        # tutte le installazioni non puntano alla nuova immagine.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/memento" >> "$GITHUB_OUTPUT"
          echo "legacy=ghcr.io/$owner/mindkeep" >> "$GITHUB_OUTPUT"

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imposta QEMU (build multi-piattaforma)
        uses: docker/setup-qemu-action@v3

      - name: Imposta Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.legacy }}:latest
            ${{ steps.image.outputs.legacy }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
