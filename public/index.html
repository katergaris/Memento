<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Memento</title>
<meta name="theme-color" content="#0B7A72" />
<meta name="description" content="Il tuo spazio personale: idee, progetti, password, documenti." />
<!-- Aggiunta alla schermata home del telefono -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Memento" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icon-64.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Scelta della lingua: solo al primissimo avvio, prima ancora che esista
     un account, quindi non puo' vivere sul server (vedi i18n.js). -->
<div id="lang-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="nest-mark" aria-hidden="true">
      <img src="/icon-192.png" width="72" height="72" alt="" />
    </div>
    <h1 data-i18n="lang_pick_title">Memento</h1>
    <p class="auth-sub" data-i18n="lang_pick_sub">Scegli la lingua — Choose your language</p>
    <div class="lang-choice">
      <button type="button" class="btn btn-primary btn-block" data-lang="it">Italiano</button>
      <button type="button" class="btn btn-primary btn-block" data-lang="en">English</button>
    </div>
  </div>
</div>

<!-- Schermata di setup / login -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="nest-mark" aria-hidden="true">
      <img src="/icon-192.png" width="72" height="72" alt="" />
    </div>
    <h1 id="auth-title">Memento</h1>
    <p class="auth-sub" id="auth-sub">Il tuo spazio personale, al sicuro.</p>

    <form id="auth-form" class="auth-form">
      <label>
        <span data-i18n="auth_username">Username</span>
        <input type="text" id="auth-username" autocomplete="username" required />
      </label>
      <label>
        <span data-i18n="auth_password">Password</span>
        <input type="password" id="auth-password" autocomplete="current-password" required />
      </label>
      <label id="auth-code-row" class="hidden">
        <span data-i18n="auth_code">Codice di verifica</span>
        <input type="text" id="auth-code" autocomplete="one-time-code" inputmode="numeric"
               data-i18n-placeholder="auth_code_placeholder" placeholder="6 cifre dall'app" maxlength="14" />
        <span class="field-hint" data-i18n="auth_code_hint">Oppure uno dei codici di recupero, se non hai il telefono.</span>
      </label>
      <p id="auth-error" class="form-error hidden"></p>
      <button type="submit" class="btn btn-primary" id="auth-submit">Entra</button>
    </form>
    <p class="auth-version" id="auth-version"></p>
  </div>
</div>

<!-- App principale: barra laterale delle sezioni (sul telefono diventa la
     barra in basso), intestazione con data, titolo e ricerca sempre
     visibile, area centrale dove si disegna la sezione aperta. -->
<div id="app" class="app hidden">
  <nav id="sidebar" class="sidebar" data-i18n-aria-label="aria_sections" aria-label="Sezioni">
    <a class="sidebar-brand" href="#/today">
      <img src="/icon.svg" width="34" height="34" alt="" />
      <span>Memento</span>
    </a>
    <div id="sidebar-nav" class="sidebar-nav"></div>
    <div class="sidebar-spacer"></div>
    <div id="sidebar-secondary" class="sidebar-nav sidebar-secondary"></div>
    <p class="sidebar-version" id="sidebar-version"></p>
  </nav>

  <div class="main-col">
    <header class="app-header">
      <div class="header-title">
        <span id="header-date" class="header-date"></span>
        <h1 id="view-title"></h1>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
        <input type="search" id="global-search" data-i18n-placeholder="search_placeholder" placeholder="Cerca in tutto Memento…" autocomplete="off" />
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results hidden" role="listbox"></div>
      </div>
      <button id="btn-nuovo" class="btn btn-capture" type="button" data-i18n-title="title_quick_capture" title="Cattura veloce — sempre disponibile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="btn_capture">Annota</span>
      </button>
    </header>
    <main id="view-host" class="view-host"></main>
  </div>

  <!-- Solo telefono: le sezioni principali sempre a un tocco, la cattura
       veloce al centro. "Sezioni" apre l'elenco completo. -->
  <nav id="tabbar" class="tabbar" data-i18n-aria-label="aria_main_nav" aria-label="Navigazione principale"></nav>
  <div id="sections-sheet" class="sections-sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="quick-capture" class="quick-capture hidden"></div>
</div>

<template id="tpl-modal">
  <div class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title"></h3>
        <button class="modal-close" data-i18n-aria-label="aria_close" aria-label="Chiudi">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</template>


<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
